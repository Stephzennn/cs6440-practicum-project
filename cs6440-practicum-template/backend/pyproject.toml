[project]
name = "practicum-api"
version = "0.1.0"
description = "Python API for the CS 6440 practicum app (Synthea data)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "uvicorn[standard]>=0.30",
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
